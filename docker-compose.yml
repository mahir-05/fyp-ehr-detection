version: '3.1'

services:
  mysql:
    image: mariadb:10.11
    container_name: openemr_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: openemr
      MYSQL_PASSWORD: openemrpass
      MYSQL_DATABASE: openemr
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"

  openemr:
    image: openemr/openemr:7.0.2
    container_name: openemr_app
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    environment:
      MYSQL_HOST: mysql
      MYSQL_ROOT_PASS: root
      MYSQL_USER: openemr
      MYSQL_PASS: openemrpass
      MYSQL_DATABASE: openemr
      OE_USER: admin
      OE_PASS: pass
    depends_on:
      - mysql
    volumes:
      - openemr_sites:/var/www/localhost/htdocs/openemr/sites

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: openemr_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      - mysql

volumes:
  mysql_data:
  openemr_sites:
